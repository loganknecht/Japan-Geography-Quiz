name: CI

on:
    pull_request:
        branches: [development, production]

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: yarn lint

    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: yarn format

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup
            - run: yarn build

    production_source:
        name: Production source
        if: github.base_ref == 'production'
        runs-on: ubuntu-latest
        steps:
            - name: Only the development branch of this repository may merge into production
              env:
                  SOURCE_BRANCH: ${{ github.head_ref }}
                  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  THIS_REPOSITORY: ${{ github.repository }}
              run: |
                  if [ "$SOURCE_BRANCH" != "development" ] || [ "$SOURCE_REPOSITORY" != "$THIS_REPOSITORY" ]; then
                      echo "::error::Pull requests into production must come from development. This one came from $SOURCE_REPOSITORY:$SOURCE_BRANCH"
                      exit 1
                  fi
